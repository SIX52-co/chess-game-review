<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Learn Chess · Chess Post-Mortem</title>
<meta name="description" content="Free chess lessons from the very basics to advanced tactics: learn how the pieces move, checkmate patterns, tactics, openings and endgames.">
<meta name="theme-color" content="#312e2b">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<style>
/* Layout: app shell — slim left nav (Plan / Lessons / Puzzles), main area switches between a card grid,
   a lesson player and the puzzle trainer (board left, panel right). Single dark theme modeled on the familiar online-chess look. */
:root {
  --bg: #312e2b;
  --nav: #262421;
  --panel: #262522;
  --panel-2: #21201d;
  --panel-3: #3c3a37;
  --panel-4: #4a4743;
  --line: #3e3c39;
  --ink: #ffffff;
  --ink-2: #dedcd9;
  --muted: #a29f9a;
  --green: #81b64c;
  --green-hi: #95c75c;
  --green-sh: #537d33;
  --red: #fa412d;
  --red-soft: #e85a4a;
  --gold: #f7c631;
  --win: #3d8fd6;
  --loss: #d9733a;
  --draw: #8a8782;
  --sq-l: #ebecd0;
  --sq-d: #739552;
  --hl-l: #f5f682;
  --hl-d: #b9ca43;
  --f-ui: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 15px; line-height: 1.5; }
button, select { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--green-hi); outline-offset: 2px; }
a { color: var(--green-hi); }

.shell { display: grid; grid-template-columns: 148px minmax(0, 1fr); min-height: 100vh; }
nav.side { background: var(--nav); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; }
nav.side .brand { font-weight: 800; font-size: 14px; padding: 6px 10px 14px; line-height: 1.2; color: var(--ink-2); }
nav.side .brand small { display: block; font-weight: 600; color: var(--muted); font-size: 11.5px; }
.navbtn { display: flex; align-items: center; gap: 10px; border: 0; background: none; color: var(--ink-2); font-weight: 700; font-size: 15px; padding: 10px; border-radius: 6px; text-align: left; }
.navbtn svg { width: 22px; height: 22px; flex: none; }
.navbtn:hover { background: var(--panel-3); color: #fff; }
.navbtn[aria-current="page"] { background: var(--panel-3); color: #fff; }
.navbtn .ct { margin-left: auto; font-size: 11px; background: var(--red-soft); color: #fff; border-radius: 9px; padding: 0 6px; }
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  nav.side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; flex-direction: row; z-index: 20; padding: 6px 10px; gap: 4px; overflow-x: auto; }
  nav.side .brand { display: none; }
  .navbtn { padding: 8px 10px; font-size: 14px; }
}
main { min-width: 0; padding-inline: 20px; padding-block: 20px 40px; }
@media (max-width: 760px) { main { padding-inline: 16px; } }
.page { max-width: 1120px; margin: 0 auto; }
.ph { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.ph h1 { margin: 0; font-size: 28px; line-height: 1.15; }
.ph p { margin: 2px 0 0; color: var(--muted); }

.ic { --s: 20px; width: var(--s); height: var(--s); border-radius: 50%; display: inline-grid; place-items: center; flex: none; color: #fff; font-weight: 800; font-size: calc(var(--s) * .52); line-height: 1; }
.ic svg { width: 62%; height: 62%; display: block; }
.ic.ok { background: var(--green); } .ic.no { background: var(--red); } .ic.star { background: var(--green); }

/* Plan */
.coachline { display: flex; gap: 12px; align-items: flex-start; margin: 0 0 20px; }
.cav { width: 52px; height: 52px; border-radius: 50%; background: var(--green); flex: none; display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.cav .pc { width: 40px; height: 40px; }
.cav.sm { width: 44px; height: 44px; } .cav.sm .pc { width: 34px; height: 34px; }
.bubble { position: relative; background: #fff; color: #2b2926; border-radius: 8px; padding: 11px 13px; min-width: 0; flex: 1; max-width: 76ch; }
.bubble::before { content: ""; position: absolute; left: -7px; top: 18px; border: 7px solid transparent; border-left: 0; border-right-color: #fff; }
.bubble p { margin: 0; } .bubble p + p { margin-top: 6px; }
.bubble h4 { margin: 10px 0 4px; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: #6b6864; }
.bubble h4:first-child { margin-top: 0; }
.bubble ol, .bubble ul { margin: 4px 0 0; padding-left: 20px; } .bubble li { margin-bottom: 4px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 24px; }
.stat { background: var(--panel); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.stat .k { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat .s { font-size: 12.5px; color: var(--muted); }
h2.sec { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }
.costbars { background: var(--panel); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.cb { display: grid; grid-template-columns: minmax(0, 230px) 1fr 54px; gap: 12px; align-items: center; font-size: 14px; border: 0; background: none; text-align: left; padding: 2px 0; }
.cb:hover .nm { color: #fff; text-decoration: underline; }
.cb .nm { color: var(--ink-2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cb .bar { height: 12px; background: var(--panel-3); border-radius: 6px; overflow: hidden; }
.cb .bar i { display: block; height: 100%; border-radius: 6px; background: var(--green); }
.cb .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
@media (max-width: 560px) { .cb { grid-template-columns: minmax(0, 1fr) 50px; } .cb .bar { grid-column: 1 / -1; grid-row: 2; } }
.note { color: var(--muted); font-size: 13px; }
.tablewrap { background: var(--panel); border-radius: 8px; overflow-x: auto; }
table.games { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.games th, table.games td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.games th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.res { font-weight: 800; } .res.win { color: var(--green-hi); } .res.loss { color: #ff7769; } .res.draw { color: var(--muted); }

/* Lesson cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.card { background: var(--panel); border-radius: 8px; overflow: hidden; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; transition: transform .12s, background .12s; }
.card:hover { background: #2d2b28; transform: translateY(-2px); }
.card .thumb { aspect-ratio: 16 / 10; background: #1c1b19; display: grid; place-items: center; position: relative; }
.card .thumb .mini { height: 88%; aspect-ratio: 1; }
.card .thumb .lvl { z-index: 2; position: absolute; left: 10px; top: 10px; font-size: 11.5px; font-weight: 800; letter-spacing: .04em; padding: 2px 8px; border-radius: 4px; background: rgba(0,0,0,.6); }
.card .thumb .done { z-index: 2; position: absolute; right: 10px; top: 10px; }
.card .cbody { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card h3 { margin: 0; font-size: 16.5px; line-height: 1.25; }
.card .meta { font-size: 13px; color: var(--muted); }
.card .pbar { height: 6px; border-radius: 3px; background: var(--panel-3); overflow: hidden; }
.card .pbar i { display: block; height: 100%; background: var(--green); }
.card .pl { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; margin-top: auto; }
.mini { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); border-radius: 3px; overflow: hidden; }
.mini > i { display: block; position: relative; }
.mini > i.l { background: var(--sq-l); } .mini > i.d { background: var(--sq-d); }
.mini > i.h::before { content: ""; position: absolute; inset: 0; background: var(--hl-l); opacity: .6; }

/* Trainer layout */
.trainer { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; max-width: 1180px; margin: 0 auto; }
@media (max-width: 960px) { .trainer { grid-template-columns: minmax(0, 1fr); } }
.boardcol { width: 100%; max-width: max(520px, min(720px, calc(100vh - 150px))); justify-self: center; }
@media (max-width: 960px) { .boardcol { max-width: 620px; } }
.tpanel { background: var(--panel); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; min-height: min(560px, calc(100vh - 60px)); }
@media (max-width: 960px) { .tpanel { min-height: 0; } }
.tp-h { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 6px; min-height: 52px; background: var(--panel-2); }
.tp-h h2 { margin: 0; font-size: 16px; font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbtn { width: 34px; height: 34px; display: grid; place-items: center; background: none; border: 0; border-radius: 4px; color: var(--muted); flex: none; }
.hbtn:hover { background: var(--panel-3); color: var(--ink); }
.hbtn svg { width: 20px; height: 20px; }
.tp-b { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.tp-f { padding: 12px 14px 14px; display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--line); }
.bigbtn { flex: 1; height: 50px; border: 0; border-radius: 8px; background: var(--green); color: #fff; font-size: 19px; font-weight: 800; box-shadow: 0 4px 0 var(--green-sh); transform: translateY(-2px); text-shadow: 0 1px 1px rgba(0,0,0,.2); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.bigbtn:hover { background: var(--green-hi); }
.bigbtn:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--green-sh); }
.bigbtn.grey { background: var(--panel-3); box-shadow: 0 4px 0 #2a2826; }
.bigbtn.grey:hover { background: var(--panel-4); }
.sqbtn { width: 50px; height: 50px; border: 0; border-radius: 8px; background: var(--panel-3); color: var(--ink-2); display: grid; place-items: center; flex: none; box-shadow: 0 4px 0 #2a2826; transform: translateY(-2px); }
.sqbtn:hover { background: var(--panel-4); color: #fff; }
.sqbtn svg { width: 22px; height: 22px; }

/* Lesson player */
.steps { display: flex; gap: 4px; padding: 10px 14px 0; }
.steps i { flex: 1; height: 6px; border-radius: 3px; background: var(--panel-3); }
.steps i.done { background: var(--green); } .steps i.cur { background: var(--ink-2); } .steps i.miss { background: var(--gold); }
.steplabel { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.lessonfeed { display: flex; gap: 10px; align-items: flex-start; }
.fbline { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; }
.fbline.ok { color: #4e8a22; } .fbline.no { color: #d4321f; }
.pvline { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; margin: 0; }
.src { font-size: 12.5px; color: var(--muted); margin: 0; }
.complete { text-align: center; padding: 14px 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.complete .big { font-size: 44px; font-weight: 800; line-height: 1; }
.complete h3 { margin: 0; font-size: 22px; }

/* Puzzle panel */
.tomove { display: flex; align-items: center; gap: 10px; padding: 14px; font-size: 20px; font-weight: 800; min-height: 60px; }
.tomove.w { background: #ffffff; color: #262421; }
.tomove.b { background: #1b1a18; color: #ffffff; }
.tomove.ok { background: var(--green); color: #fff; }
.tomove.no { background: var(--red-soft); color: #fff; }
.tomove .k { width: 30px; height: 30px; flex: none; }
.rcard { display: flex; align-items: center; gap: 12px; background: var(--panel-2); border-radius: 8px; padding: 12px; }
.rcard .lbl { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.rcard .val { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.rcard .delta { font-size: 15px; font-weight: 800; margin-left: 6px; }
.rcard .delta.up { color: var(--green-hi); } .rcard .delta.down { color: #ff7769; }
.rcard .streak { margin-left: auto; text-align: right; }
.rcard .streak .val { font-size: 24px; }
.pinfo { font-size: 13.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; }
.pinfo .row { display: flex; justify-content: space-between; gap: 8px; }
.pinfo .row span:first-child { color: var(--muted); }
.history { display: flex; gap: 4px; flex-wrap: wrap; }
.history .empty { color: var(--muted); font-size: 13px; }
.filter { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); font-weight: 700; }
.filter select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--ink-2); font-weight: 600; }
.ptools { display: flex; gap: 8px; }
.ptools .btn2 { flex: 1; justify-content: center; }
.btn2 { border: 0; border-radius: 6px; background: var(--panel-3); color: var(--ink-2); padding: 9px 12px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; }
.btn2:hover { background: var(--panel-4); color: #fff; }
.btn2 svg { width: 18px; height: 18px; }

/* Board */
.board-wrap { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; container-type: inline-size; border-radius: 3px; overflow: hidden; user-select: none; -webkit-user-select: none; }
.board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; touch-action: none; }
.sq { position: relative; display: flex; align-items: center; justify-content: center; }
.sq.l { background: var(--sq-l); } .sq.d { background: var(--sq-d); }
.sq.own { cursor: grab; }
.sq.last.l::before, .sq.sel.l::before { content: ""; position: absolute; inset: 0; background: var(--hl-l); opacity: .8; }
.sq.last.d::before, .sq.sel.d::before { content: ""; position: absolute; inset: 0; background: var(--hl-d); opacity: .8; }
.sq.hint::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 .7cqw var(--gold); z-index: 2; }
.sq .dotm { position: absolute; width: 33%; height: 33%; border-radius: 50%; background: rgba(0,0,0,.14); z-index: 2; }
.sq .ring { position: absolute; inset: 0; border-radius: 50%; border: 1.1cqw solid rgba(0,0,0,.14); z-index: 2; }
.sq.hover::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 .55cqw rgba(255,255,255,.7); z-index: 2; }
.co { position: absolute; font-size: 2.3cqw; font-weight: 700; line-height: 1; pointer-events: none; z-index: 1; }
.co.rk { top: 4%; left: 5%; } .co.fl { bottom: 4%; right: 6%; }
.sq.l .co { color: var(--sq-d); } .sq.d .co { color: var(--sq-l); }
.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.blayer { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.blayer .ic { position: absolute; transform: translate(-60%, -40%); box-shadow: 0 2px 4px rgba(0,0,0,.45); }
.pc { position: relative; z-index: 1; width: 100%; height: 100%; background-size: 100% 100%; background-repeat: no-repeat; pointer-events: none; display: block; }
.pc.lifted { opacity: .3; }

.ghost { position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; transform: translate(-50%, -50%) scale(1.1); filter: drop-shadow(0 6px 8px rgba(0,0,0,.4)); }
.pvline .mv { border: 0; background: none; color: var(--ink-2); font: inherit; padding: 1px 3px; border-radius: 3px; cursor: pointer; }
.pvline .mv:hover { background: var(--panel-3); color: #fff; }
.pvline .mv.sol { font-weight: 800; color: #fff; }
.pvline .mv.on { background: var(--panel-4); color: #fff; box-shadow: inset 0 -2px 0 var(--green); }
.pvline .mn { color: var(--muted); }
.tag.mate { background: var(--red-soft); color: #fff; }
.compare { display: flex; flex-direction: column; gap: 8px; }
.crow { background: var(--panel-2); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.crow .ch { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag { font-size: 11.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--panel-3); color: var(--ink-2); }
.tag.ok { background: var(--green); color: #fff; }
.tag.bad { background: var(--red-soft); color: #fff; }
.crow .ev { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.btn2.sm { padding: 4px 10px; font-size: 12.5px; margin-left: auto; }
.btn2.sm svg { width: 14px; height: 14px; }
.btn2.playing { background: var(--green); color: #fff; }
.pstrip { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 0 4px 34px; }
.pstrip .who { display: flex; flex-direction: column; min-width: 0; flex: 1; gap: 1px; }
.pstrip .nmrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pstrip .caps { display: flex; align-items: center; height: 18px; font-size: 12.5px; color: var(--muted); font-weight: 700; min-width: 0; overflow: hidden; }
.pstrip .caps .pc { width: 18px; height: 18px; margin-right: -7px; flex: none; }
.pstrip .caps .pc.gap { margin-left: 6px; }
.pstrip .caps .diff { margin-left: 11px; }
.brow { display: flex; gap: 8px; }
.brow .board-wrap { flex: 1; min-width: 0; }

u touch the piece.<\/li><li>Pieces can\u2019t jump over others, except the knight.<\/li><li>Take your time. There\u2019s no clock in lessons.<\/li><\/ol>", "puzzles": ["cu-check-1", "cu-check-2", "cu-check-3", "cu-check-4", "cu-check-5"], "example": "cu-check-0", "avgRating": 400}, {"id": "p-rules-castle", "title": "Castling", "intro": "<p><b>Castling<\/b> is a special king move. The king steps two squares toward a rook, and the rook jumps over to the other side of the king. You can castle if neither piece has moved, the squares between them are empty, and the king isn\u2019t in check or passing through an attacked square.<\/p><p>Drag the king two squares to castle.<\/p>", "habit": "<h4>Remember<\/h4><ol><li>Every piece moves in its own pattern. Picture it before you touch the piece.<\/li><li>Pieces can\u2019t jump over others, except the knight.<\/li><li>Take your time. There\u2019s no clock in lessons.<\/li><\/ol>", "puzzles": ["cu-castle-1", "cu-castle-2", "cu-castle-3", "cu-castle-4", "cu-castle-5"], "example": "cu-castle-0", "avgRating": 400}, {"id": "p-rules-ep", "title": "En Passant", "intro": "<p>When a pawn moves two squares and lands right beside an enemy pawn, that enemy pawn may capture it <b>as if it had moved only one square<\/b>. This is called <b>en passant<\/b>, and you must do it immediately or lose the chance.<\/p>", "habit": "<h4>Remember<\/h4><ol><li>Every piece moves in its own pattern. Picture it before you touch the piece.<\/li><li>Pieces can\u2019t jump over others, except the knight.<\/li><li>Take your time. There\u2019s no clock in lessons.<\/li><\/ol>", "puzzles": ["cu-ep-1", "cu-ep-2", "cu-ep-3", "cu-ep-4", "cu-ep-5"], "example": "cu-ep-0", "avgRating": 400}, {"id": "p-rules-promo", "title": "Promotion", "intro": "<p>A pawn that reaches the far side of the board <b>promotes<\/b>: it becomes a queen, rook, bishop or knight. Almost always you pick a queen.<\/p>", "habit": "<h4>Remember<\/h4><ol><li>Every piece moves in its own pattern. Picture it before you touch the piece.<\/li><li>Pieces can\u2019t jump over others, except the knight.<\/li><li>Take your time. There\u2019s no clock in lessons.<\/li><\/ol>", "puzzles": ["cu-promo-1", "cu-promo-2", "cu-promo-3", "cu-promo-4", "cu-promo-5"], "example": "cu-promo-0", "avgRating": 400}]}, {"id": "p-win", "title": "Winning the Game", "level": "Learn to Play", "cat": "Basics", "blurb": "Checkmate, stalemate and what the pieces are worth.", "intro": "", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "lessons": [{"id": "p-win-mate", "title": "Checkmate", "intro": "<p><b>Checkmate<\/b> is a check the king can\u2019t escape: no safe square, no block, no capture. Checkmate wins the game.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "puzzles": ["lc-1Aumo", "lc-0mlzb", "lc-0P0w2", "lc-0AOTV", "lc-0NCYa"], "example": "lc-0DSAy", "avgRating": 575}, {"id": "p-win-stalemate", "title": "Stalemate", "intro": "<p>If the player to move has <b>no legal moves<\/b> but isn\u2019t in check, it\u2019s <b>stalemate<\/b>, and the game is a draw. When you\u2019re winning, be careful not to take away every square without giving check.<\/p><p>Each position here has a mate in one, and some moves stalemate instead. Find the mate.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "puzzles": ["cu-stale-1", "cu-stale-2", "cu-stale-3", "cu-stale-4", "cu-stale-5"], "example": "cu-stale-0", "avgRating": 400}, {"id": "p-win-values", "title": "Piece Values", "intro": "<p>Pieces have rough values: pawn 1, knight 3, bishop 3, rook 5, queen 9. The king is priceless. Trading a lower-value piece for a higher one, or taking a piece for free, wins material.<\/p><p>Each challenge has a free piece to take.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "puzzles": ["lc-0Jlez", "lc-10TDQ", "lc-055H8", "lc-1XwCv", "lc-02bmv"], "example": "lc-0URgB", "avgRating": 600}, {"id": "p-win-kq", "title": "Mate with King and Queen", "intro": "<p>Your first real checkmate. Use your queen to box in the enemy king, bring your own king closer, then deliver mate. Stockfish defends.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "puzzles": [], "example": null, "link": "eg:kq"}]}, {"id": "p-mates", "title": "Checkmate Patterns", "level": "Beginner", "cat": "Checkmate", "blurb": "The mating patterns that win most games at this level.", "intro": "", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "lessons": [{"id": "p-mates-mate1", "title": "Mate in One", "intro": "<p>Scan every check. One of them ends the game.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "puzzles": ["lc-03YGJ", "lc-0BTF7", "lc-0mp8u", "lc-0PfHD", "lc-1T3Z7"], "example": "lc-02VTF", "avgRating": 900}, {"id": "p-mates-backrank", "title": "Back-Rank Mate", "intro": "<p>A king stuck behind its own pawns can be mated by a rook or queen on the back rank.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "puzzles": ["lc-1P2KY", "lc-0oXgf", "lc-05c4u", "lc-1FAC7", "lc-0GLcz"], "example": "lc-1Txju", "avgRating": 900}, {"id": "p-mates-smothered", "title": "Smothered Mate", "intro": "<p>A king surrounded by its own pieces can be mated by a single knight. It\u2019s rare, but beautiful.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "puzzles": ["lc-0RqSc", "lc-0KdLT", "lc-08sfY", "lc-0n3Aq", "lc-0OMuG"], "example": "lc-1FrhY", "avgRating": 1004}, {"id": "p-mates-kr", "title": "Mate with King and Rook", "intro": "<p>The rook mate takes more technique than the queen mate: use the rook to cut the king off, bring your king up, and push the enemy king to the edge.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "puzzles": [], "example": null, "link": "eg:kr"}]}, {"id": "p-tactics1", "title": "First Tactics", "level": "Beginner", "cat": "Tactics", "blurb": "Free pieces, forks, pins and skewers: the four tactics that decide club games.", "intro": "", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "lessons": [{"id": "p-tactics1-hanging", "title": "Free Pieces", "intro": "<p>A <b>hanging<\/b> piece is undefended, or defended fewer times than it\u2019s attacked. Look for captures that win material for free.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "puzzles": ["lc-08vD8", "lc-0Imhd", "lc-1W09O", "lc-0OiXN", "lc-0Hxu5"], "example": "lc-0clbs", "avgRating": 925}, {"id": "p-tactics1-fork", "title": "The Fork", "intro": "<p>A <b>fork<\/b> attacks two targets at once. Your opponent can only save one.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "puzzles": ["lc-1OrhF", "lc-0GgzY", "lc-01NVd", "lc-1DBiI", "lc-0qUal"], "example": "lc-0ZRD7", "avgRating": 851}, {"id": "p-tactics1-pin", "title": "The Pin", "intro": "<p>A <b>pin<\/b> attacks a piece that can\u2019t move because something more valuable sits behind it.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "puzzles": ["lc-0Q2Fk", "lc-0RBm7", "lc-1BdUP", "lc-0Jz3d", "lc-1J3bD"], "example": "lc-0CaOX", "avgRating": 901}, {"id": "p-tactics1-skewer", "title": "The Skewer", "intro": "<p>A <b>skewer<\/b> attacks a valuable piece; when it moves, you take what was behind it.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "puzzles": ["lc-0bVDU", "lc-07xj3", "lc-0j5w3", "lc-1CybE", "lc-0Q92G"], "example": "lc-0Kygw", "avgRating": 926}]}, {"id": "p-safety", "title": "Keeping Your Pieces Safe", "level": "Beginner", "cat": "Tactics", "blurb": "Defend against threats and avoid getting your pieces trapped.", "intro": "", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "lessons": [{"id": "p-safety-defend", "title": "Defending Threats", "intro": "<p>Sometimes the best move is a defensive one. Spot your opponent\u2019s threat and find the move that stops it.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "puzzles": ["lc-1XXA9", "lc-0s34Z", "lc-0cuJp", "lc-1k0Vf", "lc-09PWe"], "example": "lc-0oMM6", "avgRating": 1026}, {"id": "p-safety-trapped", "title": "Trapped Pieces", "intro": "<p>A piece with no safe squares can be won. Learn to trap enemy pieces, and to notice when yours are running out of room.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "puzzles": ["lc-0ZMjS", "lc-0hhta", "lc-1OGhi", "lc-0ge7X", "lc-1UhkY"], "example": "lc-1UVLL", "avgRating": 1056}]}, {"id": "p-tactics2", "title": "Tactical Weapons", "level": "Intermediate", "cat": "Tactics", "blurb": "Discovered attacks, double checks, deflection and attraction.", "intro": "", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "lessons": [{"id": "p-tactics2-discovered", "title": "Discovered Attacks", "intro": "<p>Move one piece to reveal an attack from the piece behind it. Two threats at once.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "puzzles": ["lc-0lmb1", "lc-0QN5u", "lc-02LtW", "lc-0Vd5r", "lc-0zS5C"], "example": "lc-0LeY6", "avgRating": 1325}, {"id": "p-tactics2-double", "title": "Double Check", "intro": "<p>A <b>double check<\/b> attacks the king with two pieces at once. The only escape is to move the king.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "puzzles": ["lc-1RuGa", "lc-1NTph", "lc-0gNUS", "lc-1O9AV", "lc-1fmb9"], "example": "lc-0oUB5", "avgRating": 1300}, {"id": "p-tactics2-deflection", "title": "Deflection", "intro": "<p>Force a defender away from its job, then strike at what it was guarding.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "puzzles": ["lc-1OyKh", "lc-06nSt", "lc-1HW54", "lc-0E2MC", "lc-1eovb"], "example": "lc-10Yz3", "avgRating": 1350}, {"id": "p-tactics2-attraction", "title": "Attraction", "intro": "<p>Lure an enemy piece, often the king, onto a square where it can be attacked.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "puzzles": ["lc-1bsyq", "lc-18eKg", "lc-19hZ0", "lc-0dlBu", "lc-0baxg"], "example": "lc-05hMr", "avgRating": 1350}, {"id": "p-tactics2-defender", "title": "Removing the Defender", "intro": "<p>Capture the piece that holds everything together, and the rest falls.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "puzzles": ["lc-0gmXL", "lc-0PrZM", "lc-0varv", "lc-1S939", "lc-1SoHY"], "example": "lc-123vc", "avgRating": 1352}]}, {"id": "p-attack", "title": "Attacking the King", "level": "Intermediate", "cat": "Checkmate", "blurb": "Mate in two, sacrifices near the king, and classic mating nets.", "intro": "", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "lessons": [{"id": "p-attack-mate2", "title": "Mate in Two", "intro": "<p>A forcing first move, then mate. Start with checks.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "puzzles": ["lc-0hhvl", "lc-1HcuU", "lc-0ANEk", "lc-0Ztth", "lc-0VxfV"], "example": "lc-0DkcS", "avgRating": 1325}, {"id": "p-attack-f7", "title": "Attacking f7 and f2", "intro": "<p>Early in the game, f7 (and f2) is defended only by the king. Many quick wins start there.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "puzzles": ["lc-1DBie", "lc-09skX", "lc-0UsCN", "lc-0uans", "lc-066RW"], "example": "lc-0507E", "avgRating": 1200}, {"id": "p-attack-sacrifice", "title": "Sacrifices", "intro": "<p>Give up material to open the king. Only when you\u2019ve calculated it to the end.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "puzzles": ["lc-1LbWZ", "lc-1KY0c", "lc-0Lw53", "lc-0Qvv9", "lc-1SM4N"], "example": "lc-074BS", "avgRating": 1425}, {"id": "p-attack-nets", "title": "Mating Nets", "intro": "<p>Arabian, Anastasia, hook and Boden\u2019s mates: patterns worth recognizing on sight.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "puzzles": ["lc-128Ed", "lc-0Hl7t", "lc-13D04", "lc-0siRL", "lc-0wNDg"], "example": "lc-0DZlM", "avgRating": 1301}]}, {"id": "p-openings", "title": "Your First Openings", "level": "Intermediate", "cat": "Openings", "blurb": "Learn a complete starter repertoire move by move, then drill it from memory.", "intro": "", "habit": "<h4>Opening principles<\/h4><ol><li>Control the center with pawns and pieces.<\/li><li>Develop knights and bishops before moving the same piece twice.<\/li><li>Castle early, and don\u2019t bring the queen out too soon.<\/li><\/ol>", "lessons": [{"id": "p-openings-italian", "title": "The Italian Game (White)", "intro": "<p>1.e4 e5 2.Nf3 Nc6 3.Bc4: quick development and pressure on f7.<\/p>", "habit": "<h4>Opening principles<\/h4><ol><li>Control the center with pawns and pieces.<\/li><li>Develop knights and bishops before moving the same piece twice.<\/li><li>Castle early, and don\u2019t bring the queen out too soon.<\/li><\/ol>", "puzzles": [], "example": null, "link": "op:italian-white"}, {"id": "p-openings-e5", "title": "Meeting 1.e4 with 1\u2026e5 (Black)", "intro": "<p>A solid, classical answer to 1.e4.<\/p>", "habit": "<h4>Opening principles<\/h4><ol><li>Control the center with pawns and pieces.<\/li><li>Develop knights and bishops before moving the same piece twice.<\/li><li>Castle early, and don\u2019t bring the queen out too soon.<\/li><\/ol>", "puzzles": [], "example": null, "link": "op:e5-black"}, {"id": "p-openings-qgd", "title": "Queen\u2019s Gambit Declined (Black)", "intro": "<p>A rock-solid defense against 1.d4.<\/p>", "habit": "<h4>Opening principles<\/h4><ol><li>Control the center with pawns and pieces.<\/li><li>Develop knights and bishops before moving the same piece twice.<\/li><li>Castle early, and don\u2019t bring the queen out too soon.<\/li><\/ol>", "puzzles": [], "example": null, "link": "op:qgd-black"}]}, {"id": "p-traps", "title": "Opening Traps and Tricks", "level": "Intermediate", "cat": "Openings", "blurb": "Punish early mistakes and avoid the classic traps.", "intro": "", "habit": "<h4>Opening principles<\/h4><ol><li>Control the center with pawns and pieces.<\/li><li>Develop knights and bishops before moving the same piece twice.<\/li><li>Castle early, and don\u2019t bring the queen out too soon.<\/li><\/ol>", "lessons": [{"id": "p-traps-traps1", "title": "Punishing Early Mistakes", "intro": "<p>Opening errors often lose material right away. Find the move that punishes them.<\/p>", "habit": "<h4>Opening principles<\/h4><ol><li>Control the center with pawns and pieces.<\/li><li>Develop knights and bishops before moving the same piece twice.<\/li><li>Castle early, and don\u2019t bring the queen out too soon.<\/li><\/ol>", "puzzles": ["lc-0fhwT", "lc-0smW1", "lc-1EgiP", "lc-14fu8", "lc-0yc7i"], "example": "lc-0YsZ1", "avgRating": 950}, {"id": "p-traps-traps2", "title": "Opening Tactics", "intro": "<p>Harder opening positions where one sharp move wins.<\/p>", "habit": "<h4>Opening principles<\/h4><ol><li>Control the center with pawns and pieces.<\/li><li>Develop knights and bishops before moving the same piece twice.<\/li><li>Castle early, and don\u2019t bring the queen out too soon.<\/li><\/ol>", "puzzles": ["lc-1cEiv", "lc-1dp5O", "lc-0kNZA", "lc-0g9eG", "lc-0q1mf"], "example": "lc-1brA6", "avgRating": 1425}]}, {"id": "p-egbasics", "title": "Endgame Essentials", "level": "Intermediate", "cat": "Endgames", "blurb": "King and pawn endings, the opposition and the rule of the square.", "intro": "", "habit": "<h4>The habit<\/h4><ol><li>Bring your king into the game. In the endgame it\u2019s a fighting piece.<\/li><li>Push passed pawns, and stop your opponent\u2019s.<\/li><li>Count moves exactly: who gets there first?<\/li><\/ol>", "lessons": [{"id": "p-egbasics-kpwin", "title": "Winning with King and Pawn", "intro": "<p>Get your king in front of the pawn, then promote.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Bring your king into the game. In the endgame it\u2019s a fighting piece.<\/li><li>Push passed pawns, and stop your opponent\u2019s.<\/li><li>Count moves exactly: who gets there first?<\/li><\/ol>", "puzzles": [], "example": null, "link": "eg:kp-win"}, {"id": "p-egbasics-kpdraw", "title": "Holding the Draw", "intro": "<p>With the right king moves, the defender can stop a lone pawn.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Bring your king into the game. In the endgame it\u2019s a fighting piece.<\/li><li>Push passed pawns, and stop your opponent\u2019s.<\/li><li>Count moves exactly: who gets there first?<\/li><\/ol>", "puzzles": [], "example": null, "link": "eg:kp-draw"}, {"id": "p-egbasics-square", "title": "The Rule of the Square", "intro": "<p>Can your king catch the pawn? Picture the square.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Bring your king into the game. In the endgame it\u2019s a fighting piece.<\/li><li>Push passed pawns, and stop your opponent\u2019s.<\/li><li>Count moves exactly: who gets there first?<\/li><\/ol>", "puzzles": [], "example": null, "link": "eg:square"}, {"id": "p-egbasics-ladder", "title": "The Ladder Mate", "intro": "<p>Two heavy pieces mate the king by walking it to the edge.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Bring your king into the game. In the endgame it\u2019s a fighting piece.<\/li><li>Push passed pawns, and stop your opponent\u2019s.<\/li><li>Count moves exactly: who gets there first?<\/li><\/ol>", "puzzles": [], "example": null, "link": "eg:ladder"}]}, {"id": "p-egrook", "title": "Rook Endgames", "level": "Advanced", "cat": "Endgames", "blurb": "The two positions every player must know, plus practice.", "intro": "", "habit": "<h4>The habit<\/h4><ol><li>Bring your king into the game. In the endgame it\u2019s a fighting piece.<\/li><li>Push passed pawns, and stop your opponent\u2019s.<\/li><li>Count moves exactly: who gets there first?<\/li><\/ol>", "lessons": [{"id": "p-egrook-lucena", "title": "The Lucena Position", "intro": "<p>The winning technique: build a bridge with your rook.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Bring your king into the game. In the endgame it\u2019s a fighting piece.<\/li><li>Push passed pawns, and stop your opponent\u2019s.<\/li><li>Count moves exactly: who gets there first?<\/li><\/ol>", "puzzles": [], "example": null, "link": "eg:lucena"}, {"id": "p-egrook-philidor", "title": "The Philidor Position", "intro": "<p>The drawing technique: keep your rook on the third rank.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Bring your king into the game. In the endgame it\u2019s a fighting piece.<\/li><li>Push passed pawns, and stop your opponent\u2019s.<\/li><li>Count moves exactly: who gets there first?<\/li><\/ol>", "puzzles": [], "example": null, "link": "eg:philidor"}, {"id": "p-egrook-rookpz", "title": "  your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "lessons": [{"id": "p-advtactics-clearance", "title": "Clearance", "intro": "<p>Move a piece out of the way, often with tempo, to open a line or square for another.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "puzzles": ["lc-0NtiE", "lc-07iaA", "lc-0XqV2", "lc-0p2vv", "lc-1jboL"], "example": "lc-09vTU", "avgRating": 1775}, {"id": "p-advtactics-interference", "title": "Interference", "intro": "<p>Block the line between an enemy piece and what it defends.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "puzzles": ["lc-0dacI", "lc-1iCEp", "lc-0F2aD", "lc-1Xr3y", "lc-0JoJB"], "example": "lc-0BjIb", "avgRating": 1799}, {"id": "p-advtactics-intermezzo", "title": "In-Between Moves", "intro": "<p>Before recapturing, look for a stronger move first.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "puzzles": ["lc-0XBpi", "lc-0UzCE", "lc-15AYG", "lc-0KW4n", "lc-1QXDS"], "example": "lc-1ZGI8", "avgRating": 1776}, {"id": "p-advtactics-xray", "title": "X-Ray Attacks", "intro": "<p>A piece attacks or defends through another piece on the same line.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Before every move, look at your opponent\u2019s <b>checks, captures and threats<\/b>.<\/li><li>Then look at your own, forcing moves first.<\/li><li>Count material before and after. If the count works, play it.<\/li><\/ol>", "puzzles": ["lc-1g0BU", "lc-043DK", "lc-0SKrd", "lc-1c4Fc", "lc-1hIvj"], "example": "lc-0KGFf", "avgRating": 1799}]}, {"id": "p-strategy", "title": "Advanced Strategy", "level": "Advanced", "cat": "Strategy", "blurb": "Quiet moves, zugzwang and long-term advantages.", "intro": "", "habit": "<h4>The habit<\/h4><ol><li>When nothing is forcing, improve your worst piece.<\/li><li>Ask what your opponent wants to do, and stop it.<\/li><li>Sometimes the strongest move is a quiet one.<\/li><\/ol>", "lessons": [{"id": "p-strategy-quiet", "title": "Quiet Moves", "intro": "<p>The winning move isn\u2019t always a check or capture. Find the calm move that leaves your opponent helpless.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>When nothing is forcing, improve your worst piece.<\/li><li>Ask what your opponent wants to do, and stop it.<\/li><li>Sometimes the strongest move is a quiet one.<\/li><\/ol>", "puzzles": ["lc-0Rlet", "lc-14m3U", "lc-1Pr30", "lc-1KK9a", "lc-13Bxb"], "example": "lc-0NJma", "avgRating": 1775}, {"id": "p-strategy-zugzwang", "title": "Zugzwang", "intro": "<p>Every move makes things worse. Put your opponent in a position where they must weaken themselves.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>When nothing is forcing, improve your worst piece.<\/li><li>Ask what your opponent wants to do, and stop it.<\/li><li>Sometimes the strongest move is a quiet one.<\/li><\/ol>", "puzzles": ["lc-05PrB", "lc-0uN1O", "lc-0LLbt", "lc-1dDBj", "lc-0zSfB"], "example": "lc-1Zr9D", "avgRating": 1725}, {"id": "p-strategy-defense", "title": "Precise Defense", "intro": "<p>Find the only move that holds.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>When nothing is forcing, improve your worst piece.<\/li><li>Ask what your opponent wants to do, and stop it.<\/li><li>Sometimes the strongest move is a quiet one.<\/li><\/ol>", "puzzles": ["lc-1OOml", "lc-0vvkP", "lc-0RqNF", "lc-1Q9xy", "lc-0pF7h"], "example": "lc-0rJ06", "avgRating": 1850}]}, {"id": "p-calc", "title": "Calculation", "level": "Advanced", "cat": "Tactics", "blurb": "Longer forcing lines: mate in three and beyond.", "intro": "", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "lessons": [{"id": "p-calc-mate3", "title": "Mate in Three", "intro": "<p>Three forcing moves. Calculate every reply.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "puzzles": ["lc-1WuwE", "lc-1bOdm", "lc-0o0Cx", "lc-01wET", "lc-1j5KP"], "example": "lc-1ADWs", "avgRating": 1700}, {"id": "p-calc-mate4", "title": "Mate in Four or More", "intro": "<p>Long mating combinations. Visualize the final position.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "puzzles": ["lc-1Pvqj", "lc-0oGoy", "lc-109gK", "lc-07R2h", "lc-1Mln7"], "example": "lc-19dN5", "avgRating": 1850}, {"id": "p-calc-long", "title": "Long Combinations", "intro": "<p>Winning lines that run many moves deep.<\/p>", "habit": "<h4>The habit<\/h4><ol><li>Look at <b>every check<\/b> you have, even odd-looking ones.<\/li><li>For each one, can the king escape, block, or capture the checker?<\/li><li>If none of those work, it\u2019s mate.<\/li><\/ol>", "puzzles": ["lc-1GU8h", "lc-0iAUM", "lc-0afbV", "lc-005f3", "lc-0DpfM"], "example": "lc-14oGx", "avgRating": 1900}]}], "puzzles": [{"id": "cu-check-0", "kind": "general", /* ---------- Mini boards for cards ---------- */
function miniBoard(fen, flipped, last) {
  const b = new Chess(fen).board(); let h = '';
  for (let row = 0; row < 8; row++) for (let col = 0; col < 8; col++) {
    const f = flipped ? 7 - col : col, r = flipped ? row : 7 - row, p = b[7 - r][f], sq = 'abcdefgh'[f] + (r + 1);
    h += `<i class="${(f + r) % 2 ? 'l' : 'd'}${last && last.includes(sq) ? ' h' : ''}">${p ? `<span class="pc ${p.color}${p.type}"></span>` : ''}</i>`;
  }
  return `<div class="mini">${h}</div>`;
}

function linkDone(link) {
  const [k, id] = link.split(':');
  if (k === 'eg') return !!(P.endgames[id] && P.endgames[id].done);
  const op = (D.openings || []).find(o => o.id === id); if (!op) return false;
  return op.lines.every((_, i) => lineState(op, i).clean >= 1);
}
function lessonProgress(l) {
  if (l.link) { const d = linkDone(l.link); return { st: { results: {} }, n: 1, solvedN: d ? 1 : 0, done: d }; }
  const st = P.lessons[l.key || l.id] || { results: {} };
  const n = l.puzzles.length, solvedN = l.puzzles.filter(id => st.results[id] != null).length;
  return { st, n, solvedN, done: !!st.done };
}
function courseProgress(c) {

  for (const l of c.lessons) { const pr = lessonProgress(l); n += pr.n; s += pr.solvedN; if (pr.done) d++; }
  return { n, s, d, total: c.lessons.length, pct: n ? Math.round(s / n * 100) : 0 };
}

const SRS_GAP = [1, 3, 7];
function srsValid(it) { return it.kind === 'pz' ? !!byId[it.id] : !!(OPS.find(o => o.id === it.op) || { lines: [] }).lines[it.li]; }
function srsDue() { const t = dayNo(); return Object.entries(P.srs || {}).filter(([, it]) => it.due <= t && srsValid(it)).map(([k, it]) => Object.assign({ key: k }, it)); }
function srsMiss(key, item) { P.srs[key] = Object.assign({}, P.srs[key] || item, { stage: 0, due: dayNo(1) }); saveV5(); updateNavCount(); }
function srsResult(key, ok) {
  const it = P.srs[key]; if (!it) return;
  if (!ok) { it.stage = 0; it.due = dayNo(1); }
  else { it.stage++; if (it.stage >= SRS_GAP.length) delete P.srs[key]; else it.due = dayNo(SRS_GAP[it.stage]); }
  saveV5(); updateNavCount();
}
function startReview() {
  const q = srsDue().filter(it => it.kind === 'pz').map(it => byId[it.id]).sort(() => Math.random() - .5);
  if (q.length) openTrainer('custom', { queue: q, review: true }); else show('review');
}
function renderReview() {
  const all = Object.entries(P.srs).filter(([, it]) => srsValid(it)).map(([k, it]) => Object.assign({ key: k }, it));
  const t = dayNo(), due = all.filter(it => it.due <= t), dueP = due.filter(it => it.kind === 'pz'), dueO = due.filter(it => it.kind === 'op');
  const inDays = (a, b) => all.filter(it => it.due - t >= a && it.due - t <= b).length;
  const opName = it => { const op = OPS.find(o => o.id === it.op); return op ? `${op.title} · ${op.lines[it.li].name}` : ''; };
  $('v-review').innerHTML = `<div class="ph"><span class="ic" style="--s:34px;background:#8a5cc2">${IC5.repeat}</span><div><h1>Review</h1><p>Puzzles you missed and opening lines you stumbled on come back after 1, 3 and 7 days. Solve one cleanly three times and it graduates.</p></div></div>
    <div class="rvsched"><div><div class="lbl">Due now</div><div class="big">${due.length}</div></div><div><div class="lbl">Tomorrow</div><div class="big">${inDays(1, 1)}</div></div><div><div class="lbl">Next 7 days</div><div class="big">${inDays(2, 7)}</div></div><div><div class="lbl">In the queue</div><div class="big">${all.length}</div></div></div>
    <div class="sgrid" style="margin-top:14px">
      <div class="scard"><h3>Puzzles</h3><p class="sub">${dueP.length ? `${dueP.length} puzzle${dueP.length === 1 ? '' : 's'} ready.` : all.some(it => it.kind === 'pz') ? 'Nothing due right now. Come back tomorrow.' : 'Miss a puzzle anywhere and it lands here.'}</p>
        ${dueP.length ? `<button class="bigbtn" id="rvGo" style="flex:none">Review ${dueP.length} puzzle${dueP.length === 1 ? '' : 's'}</button>` : ''}
        <div class="history">${dueP.slice(0, 30).map(it => `<span class="pill">${byId[it.id].rating}</span>`).join('')}</div></div>
      <div class="scard"><h3>Opening lines</h3><p class="sub">${dueO.length ? 'Drill each line from memory.' : 'Lines you make mistakes on in an opening drill land here.'}</p>
        <div class="glist">${dueO.map(it => `<button class="devrow" data-op="${esc(it.op)}" data-li="${it.li}"><span><b>${esc(opName(it))}</b><small>Step ${it.stage + 1} of 3</small></span><span class="go2" style="color:var(--green-hi);font-weight:800">Drill ›</span></button>`).join('')}</div></div>
    </div>`;
  if ($('rvGo')) $('rvGo').onclick = startReview;
  $('v-review').querySelectorAll('[data-op]').forEach(b => b.onclick = () => { show('opening', b.dataset.op); opDrill(+b.dataset.li); });
}

  sc.addEventListener('scroll', upd, { passive: true });
  jump.onclick = () => sc.scrollTo({ top: Math.max(0, place()), behavior: reduceMotion ? 'auto' : 'smooth' });
}

  book: '<path fill="currentColor" d="M4 4.5A2.5 2.5 0 016.5 2H20v16H6.5a.5.5 0 000 1H20v3H6.5A2.5 2.5 0 014 19.5z"/>',
  fork: '<path fill="currentColor" d="M6 2h2v6h1.5V2h2v6H13V2h2v7a4 4 0 01-3 3.9V22H9V12.9A4 4 0 016 9z"/>',
  pin: '<path fill="currentColor" d="M15 2l7 7-2.5.8-3.5 3.5.7 4.7-2 2-4-4-5.3 5.3-1.4-1.4L9.3 14.6l-4-4 2-2 4.7.7 3.5-3.5z"/>',
  skewer: '<path d="M3 21L21 3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="9" cy="15" r="3.4" fill="currentColor"/><circle cx="15.5" cy="8.5" r="3.4" fill="currentColor"/>',
  disc: '<path d="M4 20l7-7M4 20h6M4 20v-6M20 4l-7 7M20 4h-6M20 4v6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/>',
  exit: '<path fill="currentColor" d="M4 3h10v4h-2V5H6v14h6v-2h2v4H4z"/><path d="M10 12h10M16.5 8.5L20 12l-3.5 3.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
  spark: '<path fill="currentColor" d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/>',
  crown: '<path fill="currentColor" d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>'
};
const PUB_IC = { rook: 'pc:r', bishop: 'pc:b', queen: 'pc:q', king: 'pc:k', knight: 'pc:n', pawn: 'pc:p', capture: 'target', check: 'cross', castle: 'pc:k', ep: 'pc:p', promo: 'crown', mate: 'crown', stalemate: 'glass', values: 'spark', kq: 'pc:q',
  mate1: 'crown', backrank: 'pc:r', smothered: 'pc:n', kr: 'pc:r', hanging: 'target', fork: 'fork', pin: 'pin', skewer: 'skewer', defend: 'shield', trapped: 'alert', discovered: 'disc', double: 'disc', deflection: 'exit', attraction: 'target', defender: 'cross',
  mate2: 'crown', f7: 'target', sacrifice: 'spark', nets: 'crown', italian: 'book', e5: 'book', qgd: 'book', traps1: 'alert', traps2: 'alert', kpwin: 'pc:p', kpdraw: 'shield', square: 'cross', ladder: 'pc:r', lucena: 'pc:r', philidor: 'shield', rookpz: 'pc:r',
  pawnpz: 'pc:p', passed: 'pc:p', clearance: 'exit', interference: 'shield', intermezzo: 'glass', xray: 'skewer', quiet: 'glass', zugzwang: 'alert', defense: 'shield', mate3: 'crown', mate4: 'crown', long: 'spark' };
const LESSON_IC = { 'loose-pieces': 'target', positional: 'glass', 'missed-wins': 'cross', threats: 'shield', punish: 'alert', 'mate-danger': 'crown', pawns: 'pc:p', opening: 'book', endgame: 'pc:k',
  mate1: 'crown', hanging: 'target', fork: 'fork', backrank: 'pc:r', pin: 'pin', skewer: 'skewer', discovered: 'disc', mate2: 'crown', deflection: 'exit', sacrifice: 'spark', rookend: 'pc:r', pawnend: 'pc:p' };
function lessonIcon(key, x, y, size, col) {
  const id = key.startsWith('g/') ? key.slice(2).split('-')[0] : key, ic = (PUB && PUB_IC[key.split('-').pop()]) || LESSON_IC[id] || LESSON_IC[id.replace(/-(basics|practice|1|2)$/, '')] || 'target';
  if (ic.startsWith('pc:')) return `<foreignObject x="${x - size / 2}" y="${y - size / 2 - 2}" width="${size}" height="${size}"><div xmlns="http://www.w3.org/1999/xhtml" class="licpc" style="opacity:${col === 'dim' ? .28 : .95}"><span class="pc w${ic.slice(3)}"></span></div></foreignObject>`;
  return `<svg x="${x - size / 2}" y="${y - size / 2 - 1}" width="${size}" height="${size}" viewBox="0 0 24 24" style="color:${col === 'dim' ? 'rgba(255,255,255,.26)' : '#fff'}">${LIC[ic]}</svg>`;
}

let LV_SECT = null;
function renderLessons() {
  if (LV_LIST) return renderCatalog();
  // flatten sections -> nodes (lessons, course coins, section labels), first at the bottom
  const nodes = []; let gIdx = 0;
  LSECTIONS.forEach((s, si) => {
    if (si) nodes.push({ t: 'label', s, si });
    s.courses.forEach(cid => {
      const c = ALLC.find(x => x.id === cid); if (!c) return;
      c.lessons.forEach(l => nodes.push({ t: 'lesson', l, c, s, si, k: gIdx++ }));
      nodes.push({ t: 'coin', c, s, si, k: gIdx++ });
    });
  });
  const allL = nodes.filter(n => n.t === 'lesson');
  const cc = curCourse(), nextN = allL.find(n => n.c === cc && !lessonProgress(n.l).done) || allL.find(n => !lessonProgress(n.l).done) || allL[allL.length - 1];
  const W = 400, A = 54, B = 31, T = 9, DY = 64, TOP = 120, BOT = 200, LBL = 150;
  let y = 0; const pos = [];
  nodes.forEach(n => { if (n.t === 'label') { y += 96; pos.push(y); y += 118; } else { pos.push(y); y += DY; } });
  const H = TOP + y + BOT, yOf = i => H - BOT - pos[i];
  const COLS = [130, 200, 270], colOf = k => [0, 1, 2, 1][k % 4];
  let back = '', items = '', pieces = '', labels = '';
  const PCS = ['k', 'q', 'r', 'b', 'n', 'p'];
  // section background bands
  const bandAt = [];
  LSECTIONS.forEach((s, si) => {
    const idx = nodes.map((n, i) => [n, i]).filter(([n]) => n.si === si && n.t !== 'label').map(([, i]) => i); if (!idx.length) return;
    const top = si === LSECTIONS.length - 1 ? 0 : yOf(idx[idx.length - 1]) - DY - 40, bot = si === 0 ? H : yOf(idx[0]) + DY + 10;
    bandAt.push({ si, top, bot });
    back += `<rect x="0" y="${top}" width="${W}" height="${bot - top}" fill="${SECT_PAL[s.pal].tint}" opacity=".55"/>`;
  });
  nodes.forEach((n, i) => {
    const yy = yOf(i), pal = SECT_PAL[n.s.pal];
    if (n.t === 'label') {
      back += `<polygon points="${diamond(200, yy, 130, 62)}" fill="rgba(255,255,255,.045)"/>`;
      labels += `<text x="200" y="${yy - 8}" text-anchor="middle" class="nsx">NEXT SECTION</text><text x="200" y="${yy + 22}" text-anchor="middle" class="nst">${esc(n.s.title)}</text>`;
      return;
    }
    const col = colOf(n.k), x = COLS[col];
    if (col !== 1) {
      back += `<polygon points="${diamond(x, yy + 4, 70, 46)}" fill="rgba(255,255,255,.035)"/>`;
      const ox = col === 0 ? 270 : 130;
      back += `<polygon points="${diamond(ox, yy + 4, 70, 46)}" fill="rgba(255,255,255,.035)"/>`;
      pieces += `<ellipse cx="${ox}" cy="${yy + 20}" rx="22" ry="7.5" fill="rgba(0,0,0,.4)"/><svg x="${ox - 30}" y="${yy - 52}" width="60" height="74" viewBox="0 0 60 74">${PIECE3D[PCS[n.k % 6]]}</svg>`;
    }
    if (n.t === 'coin') {
      const done = n.c.lessons.every(l => lessonProgress(l).done);
      const c1 = done ? pal.top : pal.dim, c2 = done ? pal.s1 : pal.d1;
      items += `<g class="lnode coin" data-course="${n.c.id}" tabindex="0" role="button" aria-label="${esc(n.c.title)} course${done ? ', complete' : ''}"><ellipse cx="${x}" cy="${yy + 10}" rx="34" ry="19" fill="${c2}"/><rect x="${x - 34}" y="${yy}" width="68" height="10" fill="${c2}"/><ellipse cx="${x}" cy="${yy}" rx="34" ry="19" fill="${c1}"/><svg x="${x - 16}" y="${yy - 17}" width="32" height="32" viewBox="0 0 24 24" style="opacity:${done ? 1 : .55}">${ISO.cap.replace(/^<svg[^>]*>|<\/svg>$/g, '')}</svg></g>`;
      return;
    }
    const lp = lessonProgress(n.l), li = n.c.lessons.indexOf(n.l), prevOk = li <= 0 || lessonProgress(n.c.lessons[li - 1]).done;
    const st = lp.done ? 'done' : n === nextN ? 'cur' : (PUB && !prevOk) ? 'lock' : 'todo';
    const c = st === 'cur' ? { top: pal.hi, s1: pal.h1, s2: pal.h2 } : st === 'done' ? { top: pal.top, s1: pal.s1, s2: pal.s2 } : { top: pal.dim, s1: pal.d1, s2: pal.d2 };
    items += `<g class="lnode ${st}" data-lesson="${esc(n.l.key)}" tabindex="0" role="button" aria-label="${esc(n.l.title)}${lp.done ? ', completed' : st === 'cur' ? ', next lesson' : ''}">${block(x, yy, A, B, T, c)}${st === 'lock' ? `<svg x="${x - 13}" y="${yy - 15}" width="26" height="26" viewBox="0 0 24 24" style="color:rgba(255,255,255,.35)"><path fill="currentColor" d="M7 10V7a5 5 0 0110 0v3h1.5v11h-13V10zm2 0h6V7a3 3 0 00-6 0z"/></svg>` : lessonIcon(n.l.key, x, yy, 30, st === 'todo' ? 'dim' : 'on')}
      ${lp.done ? `<circle cx="${x + A - 14}" cy="${yy - 6}" r="8" fill="#81b64c" stroke="#fff" stroke-width="2"/><path d="M${x + A - 18} ${yy - 6}l3 3 5-5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>` : ''}
      ${st === 'cur' ? `<g class="ltag"><rect x="${x - 26}" y="${yy - B - 30}" width="52" height="20" rx="5" fill="#81b64c"/><path d="M${x - 5} ${yy - B - 10}l5 6 5-6z" fill="#81b64c"/><text x="${x}" y="${yy - B - 16}" text-anchor="middle" class="ltagt">NEXT</text></g>` : ''}
      <title>${esc(n.l.title)} (${esc(n.c.title)})${lp.solvedN ? ` · ${lp.solvedN}/${lp.n} done` : ''}</title></g>`;
  });
  const curI = nodes.indexOf(nextN), curY = yOf(curI);
  LV_SECT = nextN.si;
  const sp = s => SECT_PAL[LSECTIONS[s].pal];
  const nl = nextN.l, lp0 = lessonProgress(nl);
  const say = lp0.solvedN ? `Pick up where you left off: <b>${esc(nl.title)}</b>.` : nextN.c.id === 'mine' ? `${esc(nl.title)}. ${nl.count ? `This showed up ${nl.count} times in your games.` : ''}` : `Next up: <b>${esc(nl.title)}</b>.`;
  $('v-lessons').innerHTML = `<div class="pathpage">
    <div class="pathboard">${lessonThumb(nl)}<div class="cap"><span>${esc(nextN.c.title)}</span><span>${lp0.solvedN}/${lp0.n} challenges</span></div></div>
    <aside class="road lroad" id="lRoad" style="--tint:${sp(LV_SECT).tint}">
      <div class="road-h dark"><span class="rh-cap">${ISO.cap}</span><h2>Learn</h2></div>
      <div class="road-scroll" id="lScroll"><svg class="roadmap" viewBox="0 0 ${W} ${H}" width="100%" style="aspect-ratio:${W}/${H}" role="group" aria-label="Lessons"><defs>${PIECE3D_DEFS}</defs><rect width="${W}" height="${H}" fill="#232220"/>${back}${pieces}${items}${labels}</svg></div>
      <div class="road-coach" id="lCoach"><div class="cav sm"><span class="pc wn"></span></div><div class="bubble"><p>${say}</p></div></div>
      <button class="road-jump" id="lJump" hidden aria-label="Back to your next lesson">${ISO.up}</button>
      <div class="road-f lf">
        <div class="rf-title" id="lSectT">${esc(LSECTIONS[LV_SECT].title)}</div>
        <div class="rf-btns"><button class="rf-list" id="lpList" aria-label="All courses" title="All courses">${ISO.bullets}</button><button class="rf-go" id="lpGo">${lp0.solvedN ? 'Continue Lesson' : 'Next Lesson'}</button></div>
      </div>
    </aside></div>`;
  $('lpGo').onclick = () => show('lesson', nl.key);
  $('lpList').onclick = () => { LV_LIST = true; renderLessons(); };
  $('v-lessons').querySelectorAll('.lnode').forEach(g => {
    const go = () => {
      if (g.classList.contains('lock')) { const f = findLesson(g.dataset.lesson); if (!confirm(`Skip ahead to “${f ? f.l.title : 'this lesson'}”? The earlier lessons in this course are still waiting for you.`)) return; }
      g.dataset.lesson ? show('lesson', g.dataset.lesson) : show('course', g.dataset.course);
    };
    g.addEventListener('click', go); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  $('lCoach').onclick = () => $('lCoach').classList.add('gone');
  const sc = $('lScroll');
  roadScroll(sc, curY / H, $('lJump'));
  sc.addEventListener('scroll', () => {
    const svg = sc.querySelector('svg'), k = svg.getBoundingClientRect().height / H, mid = (sc.scrollTop + sc.clientHeight * .6) / k;
    const b = bandAt.find(b2 => mid >= b2.top && mid <= b2.bot) || bandAt[0];
    if (b && b.si !== LV_SECT) { LV_SECT = b.si; $('lSectT').textContent = LSECTIONS[b.si].title; $('lRoad').style.setProperty('--tint', sp(b.si).tint); }
  }, { passive: true });
  updateNavCount();
}

document.addEventListener('keydown', e => {
  if (e.target.closest('select, input, textarea')) return;
  if (SB) {
    if (e.key === 'ArrowLeft' && SB.idx > 0) { SB.idx--; sbShow(); e.preventDefault(); }
    else if (e.key === 'ArrowRight' && SB.idx < SB.moves.length) { const m = SB.moves[SB.idx]; SB.idx++; SB.board.anim = { from: m.from, to: m.to }; sbShow(); e.preventDefault(); }
    else if (e.key === 'Escape') closeSandbox();
    return;
  }
  if (e.key === 'ArrowRight' || e.key === 'Enter') {
    const b = view === 'ptrain' ? $('zNext') : view === 'lesson' ? $('lNext') : null;
    if (b) { e.preventDefault(); b.click(); }
  }
});

{
  const h = (location.hash || '').slice(1);
  if (h === 'rush') openRushSetup();
  else if (h === 'daily') openTrainer('daily');
  else if (['home', 'play', 'review', 'explorer', 'guess', 'vision', 'plan', 'lessons', 'puzzles', 'stats', 'custom', 'openings', 'endgames'].includes(h)) show(h);
  else show(PUB ? 'lessons' : 'home');
}
})();
</script>
